# Gradle needs plenty of memory for Minecraft decompilation.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.1,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Libraries
# GeckoLib (animated blade model). Any 4.4+ release for 1.20.1 Forge works;
# bump this if Gradle can't find the version.
geckolib_version=4.4.9
# Player Animator (first/third-person body animations for the forms).
player_anim_version=1.0.2-rc1+1.20

## Mod
mod_id=sunbreathing
mod_name=Sun Breathing
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.sunbreathing
mod_authors=firestar
mod_description=Hinokami Kagura-inspired Sun Breathing combat: breath resource, Total Concentration, a Nichirin Blade and twelve cinematic forms.
