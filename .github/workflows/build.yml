# Builds the mod jar on GitHub's servers. Push this project to a GitHub repo, open the
# "Actions" tab, and download the "sunbreathing-jar" artifact from the latest run.
name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sunbreathing-jar
          path: build/libs/*.jar
